server.port=8081

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:tutorspacedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (256-bit base64 secret)
learnspace.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
learnspace.app.jwtExpirationMs=86400000

